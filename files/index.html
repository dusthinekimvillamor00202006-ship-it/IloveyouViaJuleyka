<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120f27">
<title>Our monthsaries</title>
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--deep:#120f27;--mid:#2a2358;--panel:#1b1740;--rose:#ff9bb0;--gold:#ffe3a3;--text:#f4eefc;--mute:#a9a1c9;
--serif:"Instrument Serif",Georgia,serif;--sans:"DM Sans",system-ui,sans-serif}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100vh;font-family:var(--sans);color:var(--text);line-height:1.6;
background:radial-gradient(1200px 700px at 50% -10%,var(--mid),var(--deep) 70%) fixed,var(--deep)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
background-image:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#fff,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#ffe3a3,transparent);
background-size:200px 160px}
main{position:relative;max-width:900px;margin:0 auto;padding:clamp(28px,6vw,72px) 20px 80px}
header{text-align:center;margin-bottom:clamp(28px,6vw,56px)}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.6rem,9vw,5.2rem);line-height:1.02;margin:0 0 14px;letter-spacing:-.01em}
h1 em{color:var(--rose)}
.sub{color:var(--mute);margin:0;font-size:1.05rem}
.sub b{color:var(--gold);font-weight:700}
.sky{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px;list-style:none;margin:0;padding:0}
@media(max-width:620px){.sky{grid-template-columns:repeat(3,1fr)}}
.sky li:nth-child(even){transform:translateY(26px)}
.star{all:unset;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%;padding:10px 4px;cursor:pointer;border-radius:16px;text-align:center}
.star:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.shape{width:64px;height:64px;display:block;background:var(--gold);transition:transform .25s;
clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.glow{filter:drop-shadow(0 0 10px rgba(255,227,163,.7))}
.star:hover .shape{transform:rotate(14deg) scale(1.1)}
.star .n{font-family:var(--serif);font-size:1.35rem;line-height:1}
.star .d{font-size:.8rem;color:var(--mute)}
.star.locked{cursor:default}
.star.locked .shape{background:#3b3470}
.star.locked .glow{filter:none}
.star.locked .n{color:var(--mute)}
.star.new .glow{animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{filter:drop-shadow(0 0 22px rgba(255,155,176,.95))}}
.hint{text-align:center;color:var(--mute);margin-top:64px;font-size:.95rem}
dialog{width:min(600px,calc(100vw - 24px));max-height:calc(100vh - 24px);padding:0;border:1px solid #4a4290;border-radius:22px;background:var(--panel);color:var(--text)}
dialog::backdrop{background:rgba(10,8,25,.75)}
.in{padding:clamp(22px,5vw,38px)}
.close{position:sticky;top:8px;float:right;z-index:2;margin:8px 8px -52px 0;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:var(--mute);font-size:1.6rem;cursor:pointer}
.close:hover{color:var(--text)}
dialog h2{font-family:var(--serif);font-weight:400;font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;margin:0 0 4px}
.when{color:var(--mute);margin:0 0 22px;font-size:.9rem}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 22px;background:var(--rose);color:#2a1030;cursor:pointer;transition:transform .15s}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--text);border:1.5px solid #5a52a8}
.letter{font-family:var(--serif);font-size:1.3rem;line-height:1.55;white-space:pre-wrap;margin:0 0 6px;min-height:1.5em}
.sec{margin-top:28px}
.sec h3{font-family:var(--serif);font-weight:400;font-size:1.5rem;margin:0 0 10px;color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;text-align:left;border:1.5px solid #5a52a8;background:transparent;color:var(--text);border-radius:14px;padding:9px 14px;cursor:pointer}
.chip[aria-expanded=true]{background:#2c2565;border-color:var(--rose)}
.chip .t{display:block;margin-top:4px;color:var(--gold);font-size:.95rem}
.reason{font-family:var(--serif);font-size:1.35rem;min-height:2.8em;margin:0 0 10px;color:var(--rose)}
.pics{margin:22px 0 0}
.pics .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pics img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:14px;display:block;background:#2c2565}
.pics figcaption{font-family:var(--serif);font-style:italic;font-size:1.35rem;color:var(--rose);text-align:center;margin-top:12px}
.yn{display:flex;gap:12px;flex-wrap:wrap;align-items:center;min-height:56px;position:relative}
.ans{font-family:var(--serif);font-size:1.4rem;color:var(--rose);margin:10px 0 0}
.heart{position:fixed;pointer-events:none;z-index:99;font-size:22px;color:var(--rose)}
html{-webkit-text-size-adjust:100%}
body:has(dialog[open]){overflow:hidden}
dialog{max-height:calc(100dvh - 16px);overflow-y:auto;overscroll-behavior:contain}
.btn,.chip{min-height:44px;touch-action:manipulation}
@media(max-width:620px){
  body{background-attachment:scroll}
  main{padding-left:14px;padding-right:14px;padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  .sky{gap:10px 6px}
  .sky li:nth-child(even){transform:none}
  .shape{width:56px;height:56px}
  .star .d{font-size:.75rem}
  dialog{width:calc(100vw - 16px);border-radius:18px}
  .in{padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px))}
  .letter{font-size:1.2rem}
  .reason{font-size:1.2rem}
  .pics .grid{gap:8px}
  .btn{width:100%}
  .yn .btn{width:auto;flex:1}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title"></h1>
    <p class="sub" id="sub"></p>
  </header>
  <ol class="sky" id="sky"></ol>
  <p class="hint" id="hint"></p>
</main>
<dialog id="dlg" aria-labelledby="dt">
  <button class="close" id="x" aria-label="Close">×</button>
  <div class="in" id="body"></div>
</dialog>

<script>
/* ============================================================
   EDIT THIS PART. Everything else just works.
   ============================================================ */
const CONFIG = {
  her: "Love",              // her name or nickname
  me: "Me",                 // your name, shown at the end of letters
  start: "2026-09-20",      // the day you became a couple (YYYY-MM-DD)
  total: 12                 // how many stars to show (12 = your first year)
};

/* Add a new entry each month. Copy the block for month 1, change the number.
   A star unlocks by itself on its monthsary date.
   photos: list of image paths in your repo, like ["photos/month2.jpg"] (or leave out)
   photoCaption: optional line shown under the photos
   question: optional. Shows a Yes / Not yet button. */
const MONTHS = {
  1: {
    title: "Our first month",
    letter: "Dear {her},\n\nYou never fail to make me fall in love with you again and again. Being with you is something I didn’t expect.\n\nI want to make you happy for the rest of my life.\n\nLove,\n{me}",
    reasons: [
      "You make ordinary days feel special.",
      "The way you laugh at your own jokes.",
      "You listen like what I say matters.",
      "I feel like myself around you."
    ],
    photos: ["photos/month1-a.jpg", "photos/month1-b.jpg"],
    photoCaption: "I never get tired of seeing your beauty.",
    question: "Will you be my girlfriend for month 2?"
  }
  /* 2: { title: "...", letter: "...", memories: [], reasons: [] }, */
};
/* ============================================================ */

const $ = s => document.querySelector(s);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const start = new Date(CONFIG.start + "T00:00:00");
const preview = parseInt(new URLSearchParams(location.search).get("preview")) || 0; // ?preview=3 unlocks up to month 3 for testing
const ord = n => n + (["th","st","nd","rd"][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)]);
const fill = s => s.replaceAll("{her}", CONFIG.her).replaceAll("{me}", CONFIG.me);
const dateFor = n => new Date(start.getFullYear(), start.getMonth() + n, start.getDate());
const fmt = d => d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
const isOpen = n => preview >= n || new Date() >= dateFor(n);
const seen = () => { try { return JSON.parse(localStorage.getItem("seen") || "[]"); } catch { return []; } };
const markSeen = n => { try { const s = seen(); if (!s.includes(n)) localStorage.setItem("seen", JSON.stringify([...s, n])); } catch {} };

let latest = 0;
for (let n = 1; n <= CONFIG.total; n++) if (isOpen(n)) latest = n;
const days = Math.max(0, Math.floor((new Date() - start) / 864e5));

$("#title").innerHTML = latest
  ? `Happy ${ord(latest)} monthsary, <em>${CONFIG.her}</em>`
  : `Something is coming, <em>${CONFIG.her}</em>`;
$("#sub").innerHTML = latest
  ? `<b>${days}</b> days of us so far. Tap a star.`
  : `Your first star opens on ${fmt(dateFor(1))}.`;
$("#hint").textContent = latest < CONFIG.total ? `The next star opens on ${fmt(dateFor(latest + 1))}.` : "";

const sky = $("#sky");
for (let n = 1; n <= CONFIG.total; n++) {
  const open = isOpen(n), fresh = open && !seen().includes(n);
  const li = document.createElement("li");
  li.innerHTML = `<button class="star ${open ? "" : "locked"} ${fresh ? "new" : ""}" ${open ? "" : 'aria-disabled="true"'} aria-label="Month ${n}${open ? "" : ", locked until " + fmt(dateFor(n))}">
    <span class="${open ? "glow" : ""}"><span class="shape"></span></span>
    <span class="n">${n}</span><span class="d">${open ? fmt(dateFor(n)) : "Opens " + dateFor(n).toLocaleDateString(undefined, { month: "short", day: "numeric" })}</span></button>`;
  const b = li.firstElementChild;
  b.onclick = e => open ? show(n, e) : nudge(b);
  sky.append(li);
}

function nudge(b) {
  if (reduce) return;
  b.animate([{ transform: "translateX(0)" }, { transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "translateX(0)" }], { duration: 300 });
}

function hearts(x, y) {
  if (reduce) return;
  for (let i = 0; i < 16; i++) {
    const h = document.createElement("span");
    h.className = "heart"; h.textContent = "♥";
    h.style.left = x + "px"; h.style.top = y + "px";
    document.body.append(h);
    const a = Math.random() * Math.PI * 2, d = 60 + Math.random() * 120;
    h.animate([{ transform: "translate(0,0) scale(.6)", opacity: 1 },
      { transform: `translate(${Math.cos(a) * d}px,${Math.sin(a) * d - 60}px) scale(1.2)`, opacity: 0 }],
      { duration: 1100 + Math.random() * 500, easing: "ease-out" }).onfinish = () => h.remove();
  }
}

function typeOut(el, text, btn) {
  if (reduce) { el.textContent = text; return; }
  const words = text.split(/(\s+)/); let i = 0, stop = false;
  const skip = () => { stop = true; el.textContent = text; };
  el.onclick = skip;
  (function tick() {
    if (stop || i >= words.length) return;
    el.textContent += words[i++];
    setTimeout(tick, 55);
  })();
}

function show(n, e) {
  const m = MONTHS[n];
  const body = $("#body");
  const when = `<p class="when">${fmt(dateFor(n))}</p>`;
  if (!m) {
    body.innerHTML = `<h2 id="dt">Month ${n}</h2>${when}<p>This star is open, but its page is empty. Add an entry for month ${n} in the MONTHS list in index.html.</p>`;
  } else {
    body.innerHTML = `<h2 id="dt">${m.title || "Month " + n}</h2>${when}
      <button class="btn" id="open">Open my letter</button>
      <p class="letter" id="letter" hidden></p>
      ${(m.photos || []).length ? `<figure class="pics"><div class="grid">${m.photos.map((p, i) => `<img src="${(typeof EMBED !== 'undefined' && EMBED[p]) || p}" alt="${CONFIG.her}, month ${n}, photo ${i + 1}" loading="lazy">`).join("")}</div>${m.photoCaption ? `<figcaption>${fill(m.photoCaption)}</figcaption>` : ""}</figure>` : ""}
      ${(m.reasons || []).length ? `<div class="sec"><h3>Reasons I like you</h3><p class="reason" id="reason" aria-live="polite"></p><button class="btn ghost" id="more">Show me one</button></div>` : ""}
      ${m.question ? `<div class="sec"><h3>${fill(m.question)}</h3><div class="yn" id="yn"><button class="btn" id="yes">Yes</button><button class="btn ghost" id="no">Not yet</button></div><p class="ans" id="ans" aria-live="polite"></p></div>` : ""}`;

    $("#open").onclick = ev => {
      ev.target.hidden = true;
      const l = $("#letter"); l.hidden = false; l.textContent = "";
      typeOut(l, fill(m.letter));
      hearts(ev.clientX, ev.clientY);
    };
    if ((m.reasons || []).length) {
      let r = -1;
      const next = () => { r = (r + 1) % m.reasons.length; $("#reason").textContent = fill(m.reasons[r]); };
      $("#more").onclick = ev => { next(); hearts(ev.clientX, ev.clientY); $("#more").textContent = "Another one"; };
    }
    if (m.question) {
      $("#yes").onclick = ev => { $("#ans").textContent = "Good. I was hoping you’d say that."; hearts(ev.clientX, ev.clientY); };
      const no = $("#no");
      const dodge = () => {
        const box = $("#yn").getBoundingClientRect();
        no.style.position = "absolute";
        no.style.left = Math.random() * Math.max(10, box.width - no.offsetWidth) + "px";
        no.style.top = Math.random() * 40 + "px";
      };
      no.onmouseenter = dodge; no.onclick = dodge;
    }
  }
  markSeen(n);
  $(".star.new") && document.querySelectorAll(".star")[n - 1].classList.remove("new");
  $("#dlg").showModal();
  $("#dlg").scrollTop = 0;
}

$("#x").onclick = () => $("#dlg").close();
$("#dlg").addEventListener("click", e => { if (e.target === $("#dlg")) $("#dlg").close(); });
</script>
</body>
</html>
